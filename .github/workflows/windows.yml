name: Windows build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Compile
        run: gradle --no-daemon compileKotlin

  smoke:
    needs: compile
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Tools (virtual display, VLC, ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libvlc-dev vlc-plugin-base vlc-plugin-video-output ffmpeg fonts-dejavu > /dev/null
      - name: Test media (generated locally, no archive)
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x480:rate=25 -f lavfi -i sine=frequency=440 -t 20 -c:v mpeg4 -vtag XVID -c:a libmp3lame $RUNNER_TEMP/test.avi
          ffmpeg -loglevel error -f lavfi -i sine=frequency=330 -t 30 -c:a libmp3lame $RUNNER_TEMP/test.mp3
      - name: Run the program through its screens
        env:
          ARHIV_SMOKE: ${{ runner.temp }}/smoke
          ARHIV_SMOKE_VIDEO: ${{ runner.temp }}/test.avi
          ARHIV_SMOKE_AUDIO: ${{ runner.temp }}/test.mp3
          APPDATA: ${{ runner.temp }}/appdata
          LOCALAPPDATA: ${{ runner.temp }}/localappdata
        run: |
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          sleep 2
          timeout 240 gradle --no-daemon run || true
          cat $ARHIV_SMOKE/smoke.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: ${{ runner.temp }}/smoke

  package:
    needs: compile
    runs-on: windows-latest
    defaults: { run: { working-directory: windows, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Bundle VLC 3.0.21 (64-bit)
        run: |
          curl -fsSL -o vlc.zip https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip
          unzip -q vlc.zip -d vlc-unpacked
          src=vlc-unpacked/vlc-3.0.21
          dst=resources/windows/vlc
          mkdir -p $dst
          cp $src/libvlc.dll $src/libvlccore.dll $dst/
          cp -r $src/plugins $dst/
          # not needed inside the app: VLC's own window, skins, visualizations, lua scripts
          rm -rf $dst/plugins/gui $dst/plugins/visualization $dst/plugins/lua $dst/plugins/video_splitter
          du -sh $dst
      - name: Build MSI
        run: gradle --no-daemon packageMsi
      - name: jpackage logs
        if: failure()
        run: cat build/compose/logs/packageMsi/*.txt || true
      - name: Collect
        id: out
        run: |
          f=$(ls build/compose/binaries/main/msi/*.msi | head -1)
          ver=$(grep -oP 'val appVersion = "\K[^"]+' build.gradle.kts)
          cp "$f" "ArhivVeshchaniya-$ver.msi"
          echo "file=windows/ArhivVeshchaniya-$ver.msi" >> $GITHUB_OUTPUT
          echo "ver=$ver" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ArhivVeshchaniya-msi
          path: ${{ steps.out.outputs.file }}
      - name: Publish release
        working-directory: .
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="windows-v${{ steps.out.outputs.ver }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.out.outputs.file }}" --clobber
          else
            gh release create "$tag" "${{ steps.out.outputs.file }}" --title "Архив Вещания для Windows ${{ steps.out.outputs.ver }}" --notes "Установщик для Windows 10/11 (64-бит). VLC уже внутри."
          fi
